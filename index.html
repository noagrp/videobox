<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090909"><title>Video Box</title><link rel="icon" href="favicon-32x32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090909;color:#eee;font-family:system-ui,-apple-system,sans-serif}body{overflow-x:hidden}.top{position:fixed;z-index:30;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:flex;align-items:center;gap:8px;pointer-events:none}.top>*{pointer-events:auto}.menuBtn,.pill{height:42px;border:1px solid #ffffff25;background:#111c;color:#ddd;border-radius:22px;padding:0 15px;backdrop-filter:blur(12px);cursor:pointer}.menuBtn{width:42px;padding:0;font-size:21px}.brand{margin-left:auto;color:#777;font-size:12px;letter-spacing:.16em}.modes{display:flex;gap:4px}.pill{font-size:10px;letter-spacing:.08em}.pill.active{background:#eee;color:#111}.panel{position:fixed;z-index:40;display:none;top:64px;left:max(12px,env(safe-area-inset-left));width:min(360px,calc(100vw - 24px));padding:12px;background:#0d0d0def;border:1px solid #ffffff24;border-radius:18px;backdrop-filter:blur(16px);box-shadow:0 18px 60px #0009}.panel.open{display:block}.panel input{width:100%;height:42px;margin-bottom:7px;padding:0 12px;border:1px solid #333;border-radius:10px;background:#161616;color:#eee}.panelRow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.panel button{height:38px;border:1px solid #333;border-radius:9px;background:#151515;color:#bbb;font-size:10px;cursor:pointer}.sub{font-size:9px;color:#666;margin:9px 2px 5px}.stage{min-height:100dvh;padding:82px 20px 36px}.empty{height:calc(100dvh - 118px);display:grid;place-items:center;color:#555;text-align:center;font-size:13px;line-height:1.7}.card{position:relative;background:#111;border-radius:13px;box-shadow:0 16px 45px #0008;overflow:hidden;transition:transform .35s,opacity .35s,filter .35s}.frame{position:relative;aspect-ratio:16/9;background:#050505}.frame iframe,.thumb{position:absolute;inset:0;width:100%;height:100%;border:0}.thumb{object-fit:cover}.playCover{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(transparent,#0003);cursor:pointer}.playCover:after{content:'';width:0;height:0;border-left:22px solid #fff;border-top:13px solid transparent;border-bottom:13px solid transparent;filter:drop-shadow(0 3px 8px #000)}.caption{padding:10px 12px 12px;font-size:12px;color:#bbb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.remove{position:absolute;z-index:5;top:7px;right:7px;width:28px;height:28px;border:1px solid #ffffff35;border-radius:50%;background:#000a;color:#ddd;cursor:pointer}.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:26px 18px;align-items:center;padding:18px 2vw 60px}.wall .card:nth-child(6n+1){transform:rotate(-1.8deg) translateY(8px)}.wall .card:nth-child(6n+2){transform:rotate(1.3deg) translateY(-5px) scale(.96)}.wall .card:nth-child(6n+3){transform:rotate(-.7deg) scale(1.03)}.wall .card:nth-child(6n+4){transform:rotate(1.9deg) translateY(12px) scale(.94)}.wall .card:nth-child(6n+5){transform:rotate(-1.1deg) translateY(-7px)}.wall .card:hover{transform:rotate(0) scale(1.035);z-index:2}.film{columns:3 280px;column-gap:16px;padding:8px max(0px,4vw) 80px}.film .card{break-inside:avoid;margin:0 0 16px}.film .card:nth-child(4n+2){margin-top:25px}.carousel{height:calc(100dvh - 100px);display:flex;align-items:center;justify-content:center;perspective:1100px;overflow:hidden;touch-action:pan-y}.carousel .card{position:absolute;width:min(62vw,720px);transform-origin:center;will-change:transform}.carousel .card.hiddenCard{display:none}.nav{position:fixed;z-index:20;top:50%;transform:translateY(-50%);width:46px;height:70px;border:1px solid #ffffff20;background:#090909aa;color:#aaa;border-radius:23px;font-size:25px;cursor:pointer}.nav.prev{left:12px}.nav.next{right:12px}.allbar{position:fixed;z-index:25;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:5px;background:#090909b8;border:1px solid #ffffff20;border-radius:28px;backdrop-filter:blur(12px)}.allbar button{height:36px;padding:0 13px;border:0;border-radius:18px;background:transparent;color:#999;font-size:9px;letter-spacing:.07em;cursor:pointer}.allbar button:hover{background:#ffffff10;color:#fff}@media(max-width:700px){.top{right:10px}.brand{display:none}.modes{margin-left:auto}.pill{padding:0 10px}.stage{padding:76px 10px 70px}.wall{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 9px;padding:12px 0 60px}.caption{font-size:10px;padding:8px}.film{columns:2;column-gap:9px;padding:4px 0 70px}.film .card{margin-bottom:9px}.carousel{height:calc(100dvh - 120px)}.carousel .card{width:78vw}.nav{width:38px;height:60px}.allbar button{padding:0 9px}.panelRow{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<div class="top"><button id="menuBtn" class="menuBtn">+</button><div class="modes"><button class="pill active" data-view="wall">WALL</button><button class="pill" data-view="carousel">CAROUSEL</button><button class="pill" data-view="film">FILM</button></div><div class="brand">VIDEO BOX</div></div>
<div id="panel" class="panel"><input id="url" placeholder="Paste YouTube URL or ID"><input id="title" placeholder="Title (optional)"><div class="panelRow"><button id="add">ADD</button><button id="backup">BACKUP</button><button id="restore">RESTORE</button></div><div class="sub">Collection stays in this browser.</div><input id="restoreFile" type="file" accept="application/json" hidden></div>
<main id="stage" class="stage wall"></main><button id="prev" class="nav prev" hidden>‹</button><button id="next" class="nav next" hidden>›</button><div class="allbar"><button id="playAll">PLAY VISIBLE</button><button id="pauseAll">PAUSE VISIBLE</button><button id="muteAll">MUTE VISIBLE</button></div>
<script>
const $=id=>document.getElementById(id);let videos=[];try{videos=JSON.parse(localStorage.getItem('myWall'))||[]}catch{}videos=videos.filter(v=>v&&v.id).map((v,i)=>({id:v.id,title:v.title||'Video '+(i+1)}));let view=localStorage.getItem('videobox-view')||'wall',center=0,players=new Map(),muted=false;
function save(){localStorage.setItem('myWall',JSON.stringify(videos))}function youtubeId(s){s=(s||'').trim();if(/^[\w-]{11}$/.test(s))return s;try{const u=new URL(s);if(u.hostname.includes('youtu.be'))return u.pathname.split('/').filter(Boolean)[0]?.slice(0,11)||'';if(u.hostname.includes('youtube.com')){if(u.searchParams.get('v'))return u.searchParams.get('v').slice(0,11);const p=u.pathname.split('/').filter(Boolean);if(['embed','shorts','live'].includes(p[0]))return(p[1]||'').slice(0,11)}}catch{}return''}function thumb(id){return'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg'}function visibleCards(){return[...document.querySelectorAll('.card')].filter(el=>{if(el.classList.contains('hiddenCard'))return false;const r=el.getBoundingClientRect();return r.bottom>0&&r.top<innerHeight&&r.right>0&&r.left<innerWidth})}function stopCard(el){const f=el.querySelector('iframe');if(f){f.contentWindow?.postMessage(JSON.stringify({event:'command',func:'pauseVideo',args:[]}),'*')}}function commandVisible(cmd,args=[]){visibleCards().forEach(el=>{const f=el.querySelector('iframe');if(!f)activate(el,false);setTimeout(()=>el.querySelector('iframe')?.contentWindow?.postMessage(JSON.stringify({event:'command',func:cmd,args}), '*'),80)})}function activate(card,auto=true){if(card.querySelector('iframe'))return;const id=card.dataset.id,frame=card.querySelector('.frame');frame.innerHTML='';const f=document.createElement('iframe');f.src='https://www.youtube.com/embed/'+id+'?enablejsapi=1&playsinline=1&rel=0'+(auto?'&autoplay=1':'')+(muted?'&mute=1':'');f.allow='autoplay; encrypted-media; picture-in-picture';f.allowFullscreen=true;frame.appendChild(f);players.set(id,f)}function card(v,i){const el=document.createElement('article');el.className='card';el.dataset.id=v.id;el.dataset.index=i;const frame=document.createElement('div');frame.className='frame';const img=document.createElement('img');img.className='thumb';img.src=thumb(v.id);img.alt='';img.loading='lazy';const cover=document.createElement('div');cover.className='playCover';cover.onclick=()=>activate(el,true);frame.append(img,cover);const cap=document.createElement('div');cap.className='caption';cap.textContent=v.title||('Video '+(i+1));const del=document.createElement('button');del.className='remove';del.textContent='×';del.ariaLabel='Remove video';del.onclick=e=>{e.stopPropagation();videos.splice(i,1);center=Math.min(center,Math.max(0,videos.length-1));save();render()};el.append(del,frame,cap);return el}function carouselLayout(){const cards=[...document.querySelectorAll('.card')],n=cards.length;if(!n)return;cards.forEach((el,i)=>{let d=i-center;if(n>2){if(d>n/2)d-=n;if(d<-n/2)d+=n}const ad=Math.abs(d);el.classList.toggle('hiddenCard',ad>2);if(ad<=2){const x=d*56,scale=d===0?1:.76,z=d===0?80:0,ry=d*-32;el.style.transform=`translateX(${x}%) translateZ(${z}px) rotateY(${ry}deg) scale(${scale})`;el.style.opacity=d===0?'1':ad===1?'.65':'.22';el.style.filter=d===0?'none':'brightness(.55)'}if(d!==0)stopCard(el)})}function render(){players.clear();const st=$('stage');st.innerHTML='';st.className='stage '+view;videos.forEach((v,i)=>st.appendChild(card(v,i)));document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('prev').hidden=$('next').hidden=view!=='carousel'||videos.length<2;if(!videos.length)st.innerHTML='<div class="empty">Your video collection is empty.<br>Press + and add a YouTube link.</div>';if(view==='carousel')carouselLayout()}function setView(v){visibleCards().forEach(stopCard);view=v;localStorage.setItem('videobox-view',v);render();scrollTo(0,0)}
$('menuBtn').onclick=()=>{$('panel').classList.toggle('open');$('menuBtn').textContent=$('panel').classList.contains('open')?'×':'+'};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('add').onclick=()=>{const id=youtubeId($('url').value);if(!id){$('url').focus();return}videos.push({id,title:$('title').value.trim()||'Video '+(videos.length+1)});save();$('url').value='';$('title').value='';$('panel').classList.remove('open');$('menuBtn').textContent='+';if(view==='carousel')center=videos.length-1;render()};$('url').addEventListener('keydown',e=>{if(e.key==='Enter')$('add').click()});$('prev').onclick=()=>{if(videos.length){center=(center-1+videos.length)%videos.length;carouselLayout()}};$('next').onclick=()=>{if(videos.length){center=(center+1)%videos.length;carouselLayout()}};let sx=0;$('stage').addEventListener('pointerdown',e=>{if(view==='carousel')sx=e.clientX});$('stage').addEventListener('pointerup',e=>{if(view!=='carousel')return;const d=e.clientX-sx;if(Math.abs(d)>45)(d>0?$('prev'):$('next')).click()});$('playAll').onclick=()=>commandVisible('playVideo');$('pauseAll').onclick=()=>commandVisible('pauseVideo');$('muteAll').onclick=()=>{muted=!muted;commandVisible(muted?'mute':'unMute');$('muteAll').textContent=muted?'UNMUTE VISIBLE':'MUTE VISIBLE'};
let scrollTimer;addEventListener('scroll',()=>{visibleCards().forEach(stopCard);clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{},120)},{passive:true});$('backup').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'Video Box',videos},null,2)],{type:'application/json'}));a.download='videobox.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};$('restore').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result),list=Array.isArray(x)?x:x.videos;if(!Array.isArray(list))throw 0;videos=list.filter(v=>v&&youtubeId(v.id||v.url)).map((v,i)=>({id:youtubeId(v.id||v.url),title:String(v.title||'Video '+(i+1))}));save();center=0;render()}catch{alert('Could not read Video Box backup.')}};r.readAsText(f);e.target.value=''};render();
</script></body></html>
