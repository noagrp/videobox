<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090909"><title>Video Box</title><link rel="icon" href="favicon-32x32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090909;color:#eee;font-family:system-ui,-apple-system,sans-serif}body{overflow-x:hidden}.top{position:fixed;z-index:30;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:flex;align-items:center;pointer-events:none}.top>*{pointer-events:auto}.menuBtn{width:42px;height:42px;border:1px solid #ffffff25;background:#111c;color:#ddd;border-radius:50%;font-size:21px;backdrop-filter:blur(12px);cursor:pointer}.brand{margin-left:auto;color:#777;font-size:11px;letter-spacing:.18em}.panel{position:fixed;z-index:40;display:none;top:64px;left:max(12px,env(safe-area-inset-left));width:min(360px,calc(100vw - 24px));padding:12px;background:#0d0d0def;border:1px solid #ffffff24;border-radius:18px;backdrop-filter:blur(16px);box-shadow:0 18px 60px #0009}.panel.open{display:block}.panel input{width:100%;height:42px;margin-bottom:7px;padding:0 12px;border:1px solid #333;border-radius:10px;background:#161616;color:#eee}.panelRow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.panel button{height:38px;border:1px solid #333;border-radius:9px;background:#151515;color:#bbb;font-size:10px;cursor:pointer}.sub{font-size:9px;color:#666;margin:9px 2px 2px}.stage{min-height:100dvh;padding:82px clamp(12px,3vw,48px) 88px}.empty{height:calc(100dvh - 170px);display:grid;place-items:center;color:#555;text-align:center;font-size:13px;line-height:1.8}.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:30px 20px;align-items:center}.card{--card:#26313b;position:relative;background:var(--card);border-radius:14px;box-shadow:0 16px 42px #0009;overflow:hidden;transition:transform .3s,box-shadow .3s;transform-origin:center}.frame{position:relative;aspect-ratio:16/9;background:#050505}.frame iframe,.thumb{position:absolute;inset:0;width:100%;height:100%;border:0}.thumb{object-fit:cover}.playCover{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(transparent,#0003);cursor:pointer}.playCover:after{content:'';width:0;height:0;border-left:20px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent;filter:drop-shadow(0 3px 8px #000)}.caption{height:40px;padding:11px 13px;color:#f5f5f5;font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #0006}.remove{position:absolute;z-index:6;top:7px;right:7px;width:28px;height:28px;border:1px solid #ffffff55;border-radius:50%;background:#000a;color:#ddd;opacity:0;cursor:pointer;transition:opacity .2s}.card:hover .remove,.card:focus-within .remove{opacity:1}.card:hover{transform:rotate(0deg)!important scale(1.035)!important;z-index:5;box-shadow:0 22px 55px #000b}.allbar{position:fixed;z-index:25;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:#090909c4;border:1px solid #ffffff20;border-radius:28px;backdrop-filter:blur(12px);box-shadow:0 8px 30px #0008}.allbar button{height:36px;padding:0 13px;border:0;border-radius:18px;background:transparent;color:#999;font-size:9px;letter-spacing:.06em;cursor:pointer}.allbar button:hover{background:#ffffff10;color:#fff}.count{position:fixed;z-index:20;right:max(14px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));font-size:9px;color:#514d47;letter-spacing:.12em}#fox{position:fixed;z-index:28;width:64px;height:48px;left:12px;top:70px;cursor:pointer;user-select:none;touch-action:manipulation;filter:drop-shadow(0 0 5px #fff8) drop-shadow(0 0 12px #bde8ff55);will-change:transform,left,top;transition:filter .2s}#fox:hover{filter:drop-shadow(0 0 7px #fff) drop-shadow(0 0 16px #bde8ff99)}#fox svg{width:100%;height:100%;overflow:visible}.foxBody{fill:#fff;stroke:#dff7ff;stroke-width:1}.foxLine{fill:none;stroke:#c9f3ff;stroke-width:1.5;stroke-linecap:round}.foxEye{fill:#87dfff}.foxTail{transform-origin:27px 31px;animation:tail 1.15s ease-in-out infinite alternate}.foxEar{transform-origin:center;animation:ear 2.7s ease-in-out infinite}.foxFlame{fill:none;stroke:#fff;stroke-width:1.3;stroke-linecap:round;opacity:.65;animation:flicker 1.4s ease-in-out infinite alternate}.foxPaw{animation:paw .65s ease-in-out infinite alternate;transform-origin:center}.foxSpark{position:fixed;z-index:27;pointer-events:none;color:#fff;font-size:10px;text-shadow:0 0 7px #fff;animation:spark .85s ease-out forwards}.foxMood{position:fixed;z-index:29;pointer-events:none;color:#fff;font-size:15px;text-shadow:0 0 8px #fff;animation:mood 1.2s ease-out forwards}@keyframes tail{to{transform:rotate(-11deg) scaleY(1.06)}}@keyframes ear{0%,90%,100%{transform:rotate(0)}95%{transform:rotate(8deg)}}@keyframes flicker{to{opacity:.25;transform:translateY(-2px)}}@keyframes paw{to{transform:translateY(-1.5px)}}@keyframes spark{to{transform:translateY(-14px) scale(.2);opacity:0}}@keyframes mood{0%{opacity:0;transform:translateY(5px) scale(.5)}25%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-18px)}}#fox.sit{animation:foxSit .8s ease-in-out}#fox.spin{animation:foxSpin .7s ease-in-out}#fox.jump{animation:foxJump .65s ease-in-out}#fox.bow{animation:foxBow .8s ease-in-out}#fox.zoom{animation:foxZoom .45s ease-in-out}@keyframes foxSit{50%{transform:scale(.92,.82) translateY(8px)}}@keyframes foxSpin{to{transform:rotate(360deg)}}@keyframes foxJump{50%{transform:translateY(-28px) rotate(-7deg)}}@keyframes foxBow{50%{transform:rotate(10deg) scaleY(.85)}}@keyframes foxZoom{50%{transform:scale(1.35,.75)}}@media(max-width:700px){.brand{font-size:9px}.stage{padding:76px 9px 80px}.wall{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 9px}.caption{height:32px;padding:8px;font-size:9px}.remove{opacity:.7;top:3px;right:3px;width:24px;height:24px}.allbar button{padding:0 9px;font-size:8px}.count{display:none}#fox{width:46px;height:35px}}</style></head><body><div class="top"><button id="menuBtn" class="menuBtn">+</button><div class="brand">VIDEO BOX · WALL</div></div><div id="panel" class="panel"><input id="url" placeholder="Paste YouTube URL or ID"><input id="title" placeholder="Title (optional)"><div class="panelRow"><button id="add">ADD</button><button id="backup">BACKUP</button><button id="restore">RESTORE</button></div><div class="sub">Your wall stays in this browser.</div><input id="restoreFile" type="file" accept="application/json" hidden></div><main id="stage" class="stage wall"></main><div class="allbar"><button id="playAll">PLAY VISIBLE</button><button id="pauseAll">PAUSE VISIBLE</button><button id="muteAll">MUTE VISIBLE</button></div><div id="count" class="count"></div><div id="fox" title="Spirit fox"><svg viewBox="0 0 80 58" aria-label="Animated white flame fox" role="img"><g class="foxTail"><path class="foxBody" d="M31 37C17 42 8 37 5 29c7 4 12 1 13-4-7 2-12-2-13-8 8 5 16 1 20-5-1 7 3 10 9 13z"/><path class="foxFlame" d="M7 28c8 2 13-3 15-8M10 36c9 2 16-2 19-9M8 17c8 5 14 1 18-5"/></g><ellipse class="foxBody" cx="43" cy="34" rx="18" ry="11"/><path class="foxBody" d="M54 29c1-9 5-16 13-17 6 0 10 5 9 11-1 6-7 9-14 9z"/><path class="foxBody foxEar" d="M59 15l2-11 7 9z"/><path class="foxBody foxEar" d="M68 14l7-8-1 13z"/><path class="foxBody" d="M74 21l6 3-7 3z"/><circle class="foxEye" cx="68" cy="20" r="1.6"/><path class="foxLine" d="M62 25c4 2 7 2 10 0"/><g class="foxPaw"><path class="foxBody" d="M34 40l-2 13c3 2 6 2 8 0l1-12z"/><path class="foxBody" d="M50 41l3 12c3 1 6 0 7-2l-4-13z"/></g><path class="foxFlame" d="M39 25c-2-5 1-8 4-11 0 5 4 6 5 10M48 24c1-5 5-7 8-8-2 4 0 6 2 8"/></svg></div><script>
const $=id=>document.getElementById(id),colors=['#8f3f46','#b0663c','#a18436','#527a58','#397879','#416b91','#5d5b91','#795284','#9b5572','#52636f','#866849','#466d65'];let videos=[];try{videos=JSON.parse(localStorage.getItem('myWall'))||[]}catch{}videos=videos.filter(v=>v&&v.id).map((v,i)=>({id:v.id,title:v.title||'Video '+(i+1),seed:Number.isFinite(v.seed)?v.seed:Math.random(),color:v.color||colors[Math.floor(Math.random()*colors.length)]}));let muted=false;function save(){localStorage.setItem('myWall',JSON.stringify(videos))}save();function youtubeId(s){s=(s||'').trim();if(/^[\w-]{11}$/.test(s))return s;try{const u=new URL(s);if(u.hostname.includes('youtu.be'))return u.pathname.split('/').filter(Boolean)[0]?.slice(0,11)||'';if(u.hostname.includes('youtube.com')){if(u.searchParams.get('v'))return u.searchParams.get('v').slice(0,11);const p=u.pathname.split('/').filter(Boolean);if(['embed','shorts','live'].includes(p[0]))return(p[1]||'').slice(0,11)}}catch{}return''}function thumb(id){return'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg'}function visibleCards(){return[...document.querySelectorAll('.card')].filter(el=>{const r=el.getBoundingClientRect();return r.bottom>0&&r.top<innerHeight&&r.right>0&&r.left<innerWidth})}function command(el,cmd,args=[]){el.querySelector('iframe')?.contentWindow?.postMessage(JSON.stringify({event:'command',func:cmd,args}),'*')}function stopCard(el){command(el,'pauseVideo')}function activate(card,auto=true){if(card.querySelector('iframe')){if(auto)command(card,'playVideo');return}const id=card.dataset.id,frame=card.querySelector('.frame');frame.innerHTML='';const f=document.createElement('iframe');f.src='https://www.youtube.com/embed/'+id+'?enablejsapi=1&playsinline=1&rel=0'+(auto?'&autoplay=1':'')+(muted?'&mute=1':'');f.allow='autoplay; encrypted-media; picture-in-picture';f.allowFullscreen=true;frame.appendChild(f)}function commandVisible(cmd){visibleCards().forEach(el=>{if(!el.querySelector('iframe'))activate(el,false);setTimeout(()=>command(el,cmd),100)})}function styleCard(el,v){const r=(v.seed*9973)%1,rot=-2+r*4,scale=.96+(((v.seed*619)%1)*.07),y=-6+(((v.seed*431)%1)*14);el.style.setProperty('--card',v.color);el.style.transform=`rotate(${rot}deg) translateY(${y}px) scale(${scale})`}function card(v,i){const el=document.createElement('article');el.className='card';el.dataset.id=v.id;styleCard(el,v);const frame=document.createElement('div');frame.className='frame';const img=document.createElement('img');img.className='thumb';img.src=thumb(v.id);img.alt='';img.loading='lazy';const cover=document.createElement('div');cover.className='playCover';cover.onclick=()=>activate(el,true);frame.append(img,cover);const cap=document.createElement('div');cap.className='caption';cap.textContent=v.title;const del=document.createElement('button');del.className='remove';del.textContent='×';del.ariaLabel='Remove video';del.onclick=e=>{e.stopPropagation();videos.splice(i,1);save();render()};el.append(del,frame,cap);return el}function render(){const st=$('stage');st.innerHTML='';videos.forEach((v,i)=>st.appendChild(card(v,i)));if(!videos.length)st.innerHTML='<div class="empty">Your wall is empty.<br>Press + and add a YouTube video.</div>';$('count').textContent=videos.length?(videos.length+' VIDEO'+(videos.length===1?'':'S')):''}$('menuBtn').onclick=()=>{$('panel').classList.toggle('open');$('menuBtn').textContent=$('panel').classList.contains('open')?'×':'+'};$('add').onclick=()=>{const id=youtubeId($('url').value);if(!id){$('url').focus();return}videos.push({id,title:$('title').value.trim()||'Video '+(videos.length+1),seed:Math.random(),color:colors[Math.floor(Math.random()*colors.length)]});save();$('url').value='';$('title').value='';$('panel').classList.remove('open');$('menuBtn').textContent='+';render()};$('url').addEventListener('keydown',e=>{if(e.key==='Enter')$('add').click()});$('playAll').onclick=()=>commandVisible('playVideo');$('pauseAll').onclick=()=>commandVisible('pauseVideo');$('muteAll').onclick=()=>{muted=!muted;commandVisible(muted?'mute':'unMute');$('muteAll').textContent=muted?'UNMUTE VISIBLE':'MUTE VISIBLE'};let lastY=scrollY,scrolling=false;addEventListener('scroll',()=>{if(Math.abs(scrollY-lastY)>2&&!scrolling){scrolling=true;document.querySelectorAll('.card').forEach(stopCard)}lastY=scrollY;clearTimeout(window._vbScroll);window._vbScroll=setTimeout(()=>scrolling=false,160)},{passive:true});$('backup').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'Video Box',videos},null,2)],{type:'application/json'}));a.download='videobox.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};$('restore').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result),list=Array.isArray(x)?x:x.videos;if(!Array.isArray(list))throw 0;videos=list.filter(v=>v&&youtubeId(v.id||v.url)).map((v,i)=>({id:youtubeId(v.id||v.url),title:String(v.title||'Video '+(i+1)),seed:Number.isFinite(v.seed)?v.seed:Math.random(),color:v.color||colors[Math.floor(Math.random()*colors.length)]}));save();render()}catch{alert('Could not read Video Box backup.')}};r.readAsText(f);e.target.value=''};render();
// Spirit fox roams freely over the entire visible wall, including over video cards.
const fox=$('fox');let fx=Math.max(10,innerWidth*.35),fy=Math.max(70,innerHeight*.3),vx=31,vy=19,last=performance.now(),pausedUntil=0,flip=1;function sparkle(){if(Math.random()>.065)return;const e=document.createElement('i');e.className='foxSpark';e.textContent=Math.random()>.6?'✦':'·';e.style.left=(fx+fox.offsetWidth*.35+Math.random()*15)+'px';e.style.top=(fy+fox.offsetHeight*.65+Math.random()*8)+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),900)}function wander(t){const dt=Math.min(.04,(t-last)/1000);last=t;if(t>pausedUntil){const w=fox.offsetWidth,h=fox.offsetHeight,minX=3,minY=58,maxX=Math.max(minX,innerWidth-w-3),maxY=Math.max(minY,innerHeight-h-54);fx+=vx*dt;fy+=vy*dt;if(fx<=minX){fx=minX;vx=Math.abs(vx)}else if(fx>=maxX){fx=maxX;vx=-Math.abs(vx)}if(fy<=minY){fy=minY;vy=Math.abs(vy)}else if(fy>=maxY){fy=maxY;vy=-Math.abs(vy)}if(Math.random()<.003){vx+=(Math.random()-.5)*16;vy+=(Math.random()-.5)*12;const sp=Math.hypot(vx,vy)||1,goal=24+Math.random()*24;vx=vx/sp*goal;vy=vy/sp*goal}flip=vx>=0?1:-1;fox.style.left=fx+'px';fox.style.top=fy+'px';fox.style.transform=`scaleX(${flip})`;sparkle()}requestAnimationFrame(wander)}function mood(txt){const m=document.createElement('b');m.className='foxMood';m.textContent=txt;m.style.left=(fx+fox.offsetWidth*.55)+'px';m.style.top=(fy-7)+'px';document.body.appendChild(m);setTimeout(()=>m.remove(),1250)}const interactions=[['sit','♡',1800],['spin','✦',900],['jump','!',900],['bow','♪',1200],['zoom','✧',700]];fox.onclick=e=>{e.stopPropagation();const [cls,mark,dur]=interactions[Math.floor(Math.random()*interactions.length)];pausedUntil=performance.now()+dur;fox.classList.remove('sit','spin','jump','bow','zoom');void fox.offsetWidth;fox.classList.add(cls);mood(mark);setTimeout(()=>fox.classList.remove(cls),dur)};addEventListener('resize',()=>{fx=Math.max(3,Math.min(fx,innerWidth-fox.offsetWidth-3));fy=Math.max(58,Math.min(fy,innerHeight-fox.offsetHeight-54))});requestAnimationFrame(wander);
</script></body></html>
