<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090909"><title>Video Box</title><link rel="icon" href="favicon-32x32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090909;color:#eee;font-family:system-ui,-apple-system,sans-serif}body{overflow-x:hidden}.top{position:fixed;z-index:30;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:flex;align-items:center;pointer-events:none}.top>*{pointer-events:auto}.menuBtn{width:42px;height:42px;border:1px solid #ffffff25;background:#111c;color:#ddd;border-radius:50%;font-size:21px;backdrop-filter:blur(12px);cursor:pointer}.brand{margin-left:auto;color:#777;font-size:11px;letter-spacing:.18em}.panel{position:fixed;z-index:40;display:none;top:64px;left:max(12px,env(safe-area-inset-left));width:min(360px,calc(100vw - 24px));padding:12px;background:#0d0d0def;border:1px solid #ffffff24;border-radius:18px;backdrop-filter:blur(16px);box-shadow:0 18px 60px #0009}.panel.open{display:block}.panel input{width:100%;height:42px;margin-bottom:7px;padding:0 12px;border:1px solid #333;border-radius:10px;background:#161616;color:#eee}.panelRow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.panel button{height:38px;border:1px solid #333;border-radius:9px;background:#151515;color:#bbb;font-size:10px;cursor:pointer}.sub{font-size:9px;color:#666;margin:9px 2px 2px}.stage{min-height:100dvh;padding:82px clamp(12px,3vw,48px) 88px}.empty{height:calc(100dvh - 170px);display:grid;place-items:center;color:#555;text-align:center;font-size:13px;line-height:1.8}.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:30px 20px;align-items:center}.card{--card:#26313b;position:relative;background:var(--card);border-radius:14px;box-shadow:0 16px 42px #0009;overflow:hidden;transition:transform .3s,box-shadow .3s;transform-origin:center}.frame{position:relative;aspect-ratio:16/9;background:#050505}.frame iframe,.thumb{position:absolute;inset:0;width:100%;height:100%;border:0}.thumb{object-fit:cover}.playCover{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(transparent,#0003);cursor:pointer}.playCover:after{content:'';width:0;height:0;border-left:20px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent;filter:drop-shadow(0 3px 8px #000)}.caption{height:40px;padding:11px 13px;color:#f5f5f5;font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #0006}.remove{position:absolute;z-index:6;top:7px;right:7px;width:28px;height:28px;border:1px solid #ffffff55;border-radius:50%;background:#000a;color:#ddd;opacity:0;cursor:pointer;transition:opacity .2s}.card:hover .remove,.card:focus-within .remove{opacity:1}.card:hover{transform:rotate(0)!important scale(1.035)!important;z-index:5;box-shadow:0 22px 55px #000b}.allbar{position:fixed;z-index:25;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:#090909c4;border:1px solid #ffffff20;border-radius:28px;backdrop-filter:blur(12px);box-shadow:0 8px 30px #0008}.allbar button{height:36px;padding:0 13px;border:0;border-radius:18px;background:transparent;color:#999;font-size:9px;letter-spacing:.06em;cursor:pointer}.count{position:fixed;z-index:20;right:14px;bottom:18px;font-size:9px;color:#514d47;letter-spacing:.12em}.slime{position:fixed;z-index:28;width:48px;height:48px;pointer-events:none;will-change:left,top,transform;filter:drop-shadow(0 0 6px var(--glow)) drop-shadow(0 0 15px var(--glow))}.slime.white{--body:#f8fdff;--edge:#cdefff;--eye:#69b9dc;--glow:#d9f5ff99}.slime.gold{--body:#ffd985;--edge:#fff0b5;--eye:#9c6918;--glow:#ffc95e99}.slime svg{width:100%;height:100%;overflow:visible}.slimeShape{fill:var(--body);stroke:var(--edge);stroke-width:1.5;transform-origin:32px 39px;animation:slimePulse .7s ease-in-out infinite alternate}.slimeEye{fill:var(--eye);transform-origin:center}.slime.stunned .slimeShape{animation-play-state:paused}.slime.stunned .slimeEye{transform:scaleY(.25)}.slime.bump .slimeShape{animation:slimeBump .35s ease-out}.spark{position:fixed;z-index:27;pointer-events:none;font-size:9px;animation:spark .7s ease-out forwards}.spark.white{color:#e9fbff;text-shadow:0 0 7px #c9f3ff}.spark.gold{color:#ffe6a6;text-shadow:0 0 7px #ffc95e}@keyframes slimePulse{to{transform:scale(1.06,.94) translateY(1px)}}@keyframes slimeBump{50%{transform:scale(1.3,.7)}}@keyframes spark{to{transform:translateY(-13px) scale(.2);opacity:0}}@media(max-width:700px){.brand{font-size:9px}.stage{padding:76px 9px 80px}.wall{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 9px}.caption{height:32px;padding:8px;font-size:9px}.remove{opacity:.7;top:3px;right:3px;width:24px;height:24px}.allbar button{padding:0 9px;font-size:8px}.count{display:none}.slime{width:39px;height:39px}}</style></head><body><div class="top"><button id="menuBtn" class="menuBtn">+</button><div class="brand">VIDEO BOX · WALL</div></div><div id="panel" class="panel"><input id="url" placeholder="Paste YouTube URL or ID"><input id="title" placeholder="Title (optional)"><div class="panelRow"><button id="add">ADD</button><button id="backup">BACKUP</button><button id="restore">RESTORE</button></div><div class="sub">Your wall stays in this browser.</div><input id="restoreFile" type="file" accept="application/json" hidden></div><main id="stage" class="stage wall"></main><div class="allbar"><button id="playAll">PLAY VISIBLE</button><button id="pauseAll">PAUSE VISIBLE</button><button id="muteAll">MUTE VISIBLE</button></div><div id="count" class="count"></div><div id="slimeWhite" class="slime white"><svg viewBox="0 0 64 64"><path class="slimeShape" d="M9 43c0-10 6-18 15-21 5-2 7-6 9-15 6 7 8 13 6 18 10 3 16 10 16 19 0 9-8 13-23 13S9 52 9 43z"/><circle class="slimeEye" cx="25" cy="41" r="2.3"/><circle class="slimeEye" cx="39" cy="41" r="2.3"/></svg></div><div id="slimeGold" class="slime gold"><svg viewBox="0 0 64 64"><path class="slimeShape" d="M9 43c0-10 6-18 15-21 5-2 7-6 9-15 6 7 8 13 6 18 10 3 16 10 16 19 0 9-8 13-23 13S9 52 9 43z"/><circle class="slimeEye" cx="25" cy="41" r="2.3"/><circle class="slimeEye" cx="39" cy="41" r="2.3"/></svg></div><script>const $=id=>document.getElementById(id),colors=['#8f3f46','#b0663c','#a18436','#527a58','#397879','#416b91','#5d5b91','#795284','#9b5572','#52636f','#866849','#466d65'];let videos=[];try{videos=JSON.parse(localStorage.getItem('myWall'))||[]}catch{}videos=videos.filter(v=>v&&v.id).map((v,i)=>({id:v.id,title:v.title||'Video '+(i+1),seed:Number.isFinite(v.seed)?v.seed:Math.random(),color:v.color||colors[Math.floor(Math.random()*colors.length)]}));let muted=false;function save(){localStorage.setItem('myWall',JSON.stringify(videos))}save();function youtubeId(s){s=(s||'').trim();if(/^[\w-]{11}$/.test(s))return s;try{const u=new URL(s);if(u.hostname.includes('youtu.be'))return u.pathname.split('/').filter(Boolean)[0]?.slice(0,11)||'';if(u.hostname.includes('youtube.com')){if(u.searchParams.get('v'))return u.searchParams.get('v').slice(0,11);const p=u.pathname.split('/').filter(Boolean);if(['embed','shorts','live'].includes(p[0]))return(p[1]||'').slice(0,11)}}catch{}return''}function thumb(id){return'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg'}function visibleCards(){return[...document.querySelectorAll('.card')].filter(el=>{const r=el.getBoundingClientRect();return r.bottom>0&&r.top<innerHeight&&r.right>0&&r.left<innerWidth})}function command(el,cmd,args=[]){el.querySelector('iframe')?.contentWindow?.postMessage(JSON.stringify({event:'command',func:cmd,args}),'*')}function stopCard(el){command(el,'pauseVideo')}function activate(card,auto=true){if(card.querySelector('iframe')){if(auto)command(card,'playVideo');return}const id=card.dataset.id,frame=card.querySelector('.frame');frame.innerHTML='';const f=document.createElement('iframe');f.src='https://www.youtube.com/embed/'+id+'?enablejsapi=1&playsinline=1&rel=0'+(auto?'&autoplay=1':'')+(muted?'&mute=1':'');f.allow='autoplay; encrypted-media; picture-in-picture';f.allowFullscreen=true;frame.appendChild(f)}function commandVisible(cmd){visibleCards().forEach(el=>{if(!el.querySelector('iframe'))activate(el,false);setTimeout(()=>command(el,cmd),100)})}function styleCard(el,v){const r=(v.seed*9973)%1,rot=-2+r*4,scale=.96+(((v.seed*619)%1)*.07),y=-6+(((v.seed*431)%1)*14);el.style.setProperty('--card',v.color);el.style.transform=`rotate(${rot}deg) translateY(${y}px) scale(${scale})`}function card(v,i){const el=document.createElement('article');el.className='card';el.dataset.id=v.id;styleCard(el,v);const frame=document.createElement('div');frame.className='frame';const img=document.createElement('img');img.className='thumb';img.src=thumb(v.id);img.alt='';img.loading='lazy';const cover=document.createElement('div');cover.className='playCover';cover.onclick=()=>activate(el,true);frame.append(img,cover);const cap=document.createElement('div');cap.className='caption';cap.textContent=v.title;const del=document.createElement('button');del.className='remove';del.textContent='×';del.ariaLabel='Remove video';del.onclick=e=>{e.stopPropagation();videos.splice(i,1);save();render()};el.append(del,frame,cap);return el}function render(){const st=$('stage');st.innerHTML='';videos.forEach((v,i)=>st.appendChild(card(v,i)));if(!videos.length)st.innerHTML='<div class="empty">Your wall is empty.<br>Press + and add a YouTube video.</div>';$('count').textContent=videos.length?videos.length+' VIDEO'+(videos.length===1?'':'S'):''}$('menuBtn').onclick=()=>{$('panel').classList.toggle('open');$('menuBtn').textContent=$('panel').classList.contains('open')?'×':'+'};$('add').onclick=()=>{const id=youtubeId($('url').value);if(!id)return $('url').focus();videos.push({id,title:$('title').value.trim()||'Video '+(videos.length+1),seed:Math.random(),color:colors[Math.floor(Math.random()*colors.length)]});save();$('url').value='';$('title').value='';$('panel').classList.remove('open');$('menuBtn').textContent='+';render()};$('url').addEventListener('keydown',e=>{if(e.key==='Enter')$('add').click()});$('playAll').onclick=()=>commandVisible('playVideo');$('pauseAll').onclick=()=>commandVisible('pauseVideo');$('muteAll').onclick=()=>{muted=!muted;commandVisible(muted?'mute':'unMute');$('muteAll').textContent=muted?'UNMUTE VISIBLE':'MUTE VISIBLE'};let lastY=scrollY,scrolling=false;addEventListener('scroll',()=>{if(Math.abs(scrollY-lastY)>2&&!scrolling){scrolling=true;document.querySelectorAll('.card').forEach(stopCard)}lastY=scrollY;clearTimeout(window._vbScroll);window._vbScroll=setTimeout(()=>scrolling=false,160)},{passive:true});$('backup').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'Video Box',videos},null,2)],{type:'application/json'}));a.download='videobox.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};$('restore').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result),list=Array.isArray(x)?x:x.videos;if(!Array.isArray(list))throw 0;videos=list.filter(v=>v&&youtubeId(v.id||v.url)).map((v,i)=>({id:youtubeId(v.id||v.url),title:String(v.title||'Video '+(i+1)),seed:Number.isFinite(v.seed)?v.seed:Math.random(),color:v.color||colors[Math.floor(Math.random()*colors.length)]}));save();render()}catch{alert('Could not read Video Box backup.')}};r.readAsText(f);e.target.value=''};render();const W=$('slimeWhite'),G=$('slimeGold');let a={el:W,x:innerWidth*.28,y:innerHeight*.35,vx:34,vy:18,kind:'white'},b={el:G,x:innerWidth*.68,y:innerHeight*.55,vx:-28,vy:-16,kind:'gold'},last=performance.now(),stunnedUntil=performance.now()+2200,bumpLock=0;function stun(){stunnedUntil=performance.now()+2400;W.classList.add('stunned');G.classList.add('stunned')}function spark(s){if(Math.random()>.06)return;const e=document.createElement('i');e.className='spark '+s.kind;e.textContent=Math.random()>.6?'✦':'·';e.style.left=(s.x+s.el.offsetWidth*.45)+'px';e.style.top=(s.y+s.el.offsetHeight*.7)+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),750)}function bounds(s){const w=s.el.offsetWidth,h=s.el.offsetHeight,minX=2,minY=58,maxX=Math.max(2,innerWidth-w-2),maxY=Math.max(58,innerHeight-h-54);if(s.x<minX){s.x=minX;s.vx=Math.abs(s.vx)}if(s.x>maxX){s.x=maxX;s.vx=-Math.abs(s.vx)}if(s.y<minY){s.y=minY;s.vy=Math.abs(s.vy)}if(s.y>maxY){s.y=maxY;s.vy=-Math.abs(s.vy)}}function bump(t){const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d<42&&t>bumpLock){bumpLock=t+900;const nx=dx/(d||1),ny=dy/(d||1);a.vx=-nx*55+(Math.random()-.5)*25;a.vy=-ny*45+(Math.random()-.5)*25;b.vx=nx*55+(Math.random()-.5)*25;b.vy=ny*45+(Math.random()-.5)*25;W.classList.add('bump');G.classList.add('bump');setTimeout(()=>{W.classList.remove('bump');G.classList.remove('bump')},380)}}function move(t){const dt=Math.min(.04,(t-last)/1000);last=t;if(t>=stunnedUntil){W.classList.remove('stunned');G.classList.remove('stunned');const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,chase=.7;a.vx+=dx/d*chase;a.vy+=dy/d*chase;b.vx-=dx/d*chase*.55;b.vy-=dy/d*chase*.55;for(const s of[a,b]){if(Math.random()<.005){s.vx+=(Math.random()-.5)*22;s.vy+=(Math.random()-.5)*18}const speed=Math.hypot(s.vx,s.vy)||1,max=52;if(speed>max){s.vx=s.vx/speed*max;s.vy=s.vy/speed*max}s.x+=s.vx*dt;s.y+=s.vy*dt;bounds(s);s.el.style.left=s.x+'px';s.el.style.top=s.y+'px';const sx=s.vx>=0?1:-1,stretch=Math.min(.13,Math.abs(s.vx)/400);s.el.style.transform=`scaleX(${sx*(1+stretch)}) scaleY(${1-stretch*.55})`;spark(s)}bump(t)}requestAnimationFrame(move)}['pointermove','pointerdown','touchstart','wheel','keydown'].forEach(ev=>addEventListener(ev,stun,{passive:true}));addEventListener('scroll',stun,{passive:true});addEventListener('resize',()=>{bounds(a);bounds(b)});requestAnimationFrame(move);</script></body></html>
